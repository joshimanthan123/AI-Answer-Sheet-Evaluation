version: '3.8'

services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: ai_eval_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=ai_evaluation_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - ai_eval_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping: 1})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. FastAPI OCR Microservice (PaddleOCR)
  ocr-service:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    container_name: ai_eval_ocr_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
      - HWR_PROVIDER=textract
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - OCR_MAX_UPLOAD_SIZE_MB=20
    volumes:
      - ocr_storage:/app/storage
      - ocr_logs:/app/logs
    networks:
      - ai_eval_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

  # 3. Node.js Express Backend
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ai_eval_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/ai_evaluation_db
      - CORS_ORIGIN=http://localhost,http://localhost:5173,http://localhost:80
      - OCR_SERVICE_URL=http://ocr-service:8000
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-prod_secure_jwt_access_secret_ai_eval_2026}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-prod_secure_jwt_refresh_secret_ai_eval_2026}
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_MODEL_NAME=gpt-4o
      - AI_TIMEOUT=30000
      - HWR_PROVIDER=textract
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      ocr-service:
        condition: service_healthy
    networks:
      - ai_eval_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 4. React + Vite Frontend (Nginx Production Server)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api/v1
    container_name: ai_eval_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ai_eval_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  ai_eval_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  ocr_storage:
    driver: local
  ocr_logs:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
