name: CI/CD Pipeline — Build & Test Verification

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # Job 1: Build & Verify Frontend React Client
  build-frontend:
    name: Build Frontend (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Build client production bundle
        run: cd client && npm run build

  # Job 2: Verify Express Backend & Run Tests
  test-backend:
    name: Test Backend (Node.js + Express)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: cd server && npm ci

      - name: Validate server syntax
        run: cd server && node --check server.js

  # Job 3: Verify Python FastAPI OCR Service
  test-ocr-service:
    name: Test OCR Service (FastAPI + Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ocr-service/requirements.txt

      - name: Install OCR requirements
        run: cd ocr-service && pip install -r requirements.txt

      - name: Compile Python modules
        run: cd ocr-service && python -m compileall app

  # Job 4: Verify Docker Build Configurations
  docker-build-check:
    name: Verify Docker Container Builds
    runs-on: ubuntu-latest
    needs: [build-frontend, test-backend, test-ocr-service]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: false
          tags: ai-eval-frontend:test

      - name: Build Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: ai-eval-backend:test

      - name: Build OCR Service Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./ocr-service
          push: false
          tags: ai-eval-ocr:test
